<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urumi · Store Assistant</title>
  <style>
    :root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--border:#2a2f3a;--text:#e6e9ef;--muted:#8b93a3;--accent:#6aa3ff;--ok:#3fb950;}
    *{box-sizing:border-box} html,body{height:100%;margin:0}
    body{background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
    header{padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel);display:flex;align-items:center;gap:10px}
    .brand{font-weight:700}.brand-dim{color:var(--muted);font-weight:500}
    .prov{margin-left:auto;color:var(--muted);font-size:12px;font-family:ui-monospace,monospace}
    #chat{flex:1;overflow-y:auto;padding:20px;max-width:820px;width:100%;margin:0 auto}
    .msg{display:flex;margin:10px 0}
    .msg.user{justify-content:flex-end}
    .bubble{max-width:80%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
    .user .bubble{background:var(--accent);color:#0b1020;border-bottom-right-radius:4px}
    .assistant .bubble{background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:4px}
    .steps{max-width:820px;margin:4px auto;width:100%}
    .step{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--muted);background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;margin:4px 0}
    .step b{color:var(--ok)}
    footer{border-top:1px solid var(--border);background:var(--panel);padding:12px 20px}
    form{display:flex;gap:10px;max-width:820px;margin:0 auto;width:100%}
    input{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:11px 13px;border-radius:10px;font-size:14px}
    input:focus{outline:none;border-color:var(--accent)}
    button{background:var(--accent);border:none;color:#0b1020;font-weight:600;padding:0 18px;border-radius:10px;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    .muted{color:var(--muted)}
  </style>
</head>
<body>
  <header>
    <span class="brand">urumi<span class="brand-dim"> · store assistant</span></span>
    <span class="prov" id="prov"></span>
  </header>
  <div id="chat">
    <div class="msg assistant"><div class="bubble">Hi! Ask me about the store — e.g. “list the products” or “how many orders are there?”</div></div>
  </div>
  <footer>
    <form id="form">
      <input id="input" placeholder="Ask about products or orders…" autocomplete="off" autofocus />
      <button id="send" type="submit">Send</button>
    </form>
  </footer>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const history = []; // {role, content}

    function bubble(role, text) {
      const w = document.createElement("div");
      w.className = "msg " + role;
      const b = document.createElement("div");
      b.className = "bubble";
      b.textContent = text;
      w.appendChild(b); chat.appendChild(w); chat.scrollTop = chat.scrollHeight;
      return b;
    }
    function steps(list) {
      if (!list || !list.length) return;
      const wrap = document.createElement("div");
      wrap.className = "steps";
      for (const s of list) {
        const d = document.createElement("div");
        d.className = "step";
        d.innerHTML = "🔧 <b>" + s.name + "</b>(" + JSON.stringify(s.arguments) + ")";
        wrap.appendChild(d);
      }
      chat.appendChild(wrap); chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = ""; send.disabled = true;
      bubble("user", text);
      history.push({ role: "user", content: text });
      const thinking = bubble("assistant", "…");
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        thinking.remove();
        if (!res.ok) { bubble("assistant", "⚠️ " + (data.error || "error")); }
        else {
          steps(data.steps);
          bubble("assistant", data.answer);
          history.push({ role: "assistant", content: data.answer });
        }
      } catch (err) {
        thinking.textContent = "⚠️ " + err.message;
      } finally { send.disabled = false; input.focus(); }
    });

    fetch("/healthz").then(r => r.json()).then(d => {
      document.getElementById("prov").textContent = d.provider || "";
    }).catch(() => {});
  </script>
</body>
</html>
