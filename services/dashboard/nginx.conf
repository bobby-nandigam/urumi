# Serves the built SPA and reverse-proxies /api to the gateway Service.
# Because the browser only ever hits this origin, there is no CORS: nginx is
# the single front door for both the static assets and the management API.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Management API -> gateway ClusterIP service (same namespace). The trailing
  # slashes matter: /api/overview is forwarded to http://gateway/api/overview.
  location /api/ {
    proxy_pass http://gateway/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback: unknown paths return index.html so client-side state works.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
