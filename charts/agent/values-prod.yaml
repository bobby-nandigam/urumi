# Production overlay for the chat agent — CONFIG ONLY.
#   helm upgrade --install agent charts/agent -n urumi -f charts/agent/values-prod.yaml \
#     --set gatewayApiKey=urumi_...   (a member-role key minted in the dashboard)

image:
  repository: registry.example.com/urumi/agent
  pullPolicy: Always

replicas: 2

ingress:
  host: agent.urumi.example.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - hosts: [agent.urumi.example.com]
      secretName: agent-tls

llm:
  # Prod uses Cloudflare Workers AI — a hosted, free-tier LLM reachable from the
  # VPS with no local Ollama. Supply the token at install:
  #   --set llm.cloudflare.accountId=<id> --set llm.cloudflare.apiToken=<token>
  provider: cloudflare
  cloudflare:
    model: "@cf/zai-org/glm-4.7-flash"

gateway:
  mcpUrl: http://gateway/mcp

maxSteps: 6

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 384Mi }
