image:
  repository: urumi/agent
  tag: "0.1.1"
  pullPolicy: IfNotPresent

replicas: 1

service:
  port: 80

# Chat UI at http://agent.urumi.localhost:8080 via Traefik.
ingress:
  enabled: true
  className: traefik
  host: agent.urumi.localhost

llm:
  # "ollama" (local/self-hosted) or "cloudflare" (hosted Workers AI, free tier).
  provider: ollama
  # Ollama runs on the developer's Mac; k3d injects host.k3d.internal into
  # CoreDNS so in-cluster pods can reach the host.
  ollamaUrl: http://host.k3d.internal:11434
  ollamaModel: qwen2.5:3b
  # Cloudflare Workers AI — a free, hosted LLM reachable from anywhere (incl. a
  # VPS). Set provider=cloudflare and supply accountId + apiToken at install.
  cloudflare:
    accountId: ""
    apiToken: ""           # stored only in the agent Secret; never commit a real one
    model: "@cf/zai-org/glm-4.7-flash"   # Cloudflare's recommended fast tool-calling model

gateway:
  # The gateway's MCP data-plane endpoint (in-cluster Service).
  mcpUrl: http://gateway/mcp

# REQUIRED: a member-role gateway API key, minted in the dashboard. Passed at
# install time (`--set gatewayApiKey=urumi_...`); stored only in a Secret.
gatewayApiKey: ""

# Max tool-call rounds per message before the loop stops.
maxSteps: 6

resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits:   { cpu: 200m, memory: 192Mi }
