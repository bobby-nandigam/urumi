image:
  repository: urumi/agent
  tag: "0.1.1"
  pullPolicy: IfNotPresent

replicas: 1

service:
  port: 80

# Chat UI at http://agent.urumi.localhost:8080 via Traefik.
ingress:
  enabled: true
  className: traefik
  host: agent.urumi.localhost

llm:
  # Default: Cloudflare Workers AI (hosted, free tier). "ollama" is the
  # local/self-hosted fallback.
  provider: cloudflare
  # Cloudflare Workers AI. accountId + apiToken are NOT stored in the chart —
  # supply them only at install so no credentials live in the repo:
  #   --set llm.cloudflare.accountId=<id> --set llm.cloudflare.apiToken=<token>
  cloudflare:
    accountId: ""          # required at install (not secret, but kept out of the repo)
    apiToken: ""           # required at install; stored only in the agent Secret, never committed
    model: "@cf/zai-org/glm-4.7-flash"   # Cloudflare's recommended fast tool-calling model
  # Ollama fallback — reached from pods via host.k3d.internal (k3d injects it
  # into CoreDNS). Used when provider=ollama.
  ollamaUrl: http://host.k3d.internal:11434
  ollamaModel: qwen2.5:3b

gateway:
  # The gateway's MCP data-plane endpoint (in-cluster Service).
  mcpUrl: http://gateway/mcp

# REQUIRED: a member-role gateway API key, minted in the dashboard. Passed at
# install time (`--set gatewayApiKey=urumi_...`); stored only in a Secret.
gatewayApiKey: ""

# Max tool-call rounds per message before the loop stops.
maxSteps: 6

resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits:   { cpu: 200m, memory: 192Mi }
