# The agent's own Secret holds only the Cloudflare token. Its GATEWAY_API_KEY is
# NOT set here — it is read from the "gateway-admin" Secret that the gateway
# writes on first boot (key AGENT_API_KEY), so the gateway API key is applied
# automatically with no copy-paste and no --set.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent.fullname" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Cloudflare API token (only used when llm.provider=cloudflare); empty otherwise.
  CF_API_TOKEN: {{ .Values.llm.cloudflare.apiToken | default "" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent.fullname" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agent.fullname" . }}
  template:
    metadata:
      labels:
        {{- include "agent.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: PORT
              value: "8080"
            - name: LLM_PROVIDER
              value: {{ .Values.llm.provider | quote }}
            - name: OLLAMA_URL
              value: {{ .Values.llm.ollamaUrl | quote }}
            - name: OLLAMA_MODEL
              value: {{ .Values.llm.ollamaModel | quote }}
            - name: CF_ACCOUNT_ID
              value: {{ .Values.llm.cloudflare.accountId | quote }}
            - name: CF_MODEL
              value: {{ .Values.llm.cloudflare.model | quote }}
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent.fullname" . }}
                  key: CF_API_TOKEN
            - name: MAX_STEPS
              value: {{ .Values.maxSteps | quote }}
            - name: GATEWAY_MCP_URL
              value: {{ .Values.gateway.mcpUrl | quote }}
            # Read from the gateway-written Secret, not the agent's own —
            # applied automatically, never copy-pasted.
            - name: GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gatewayKeySecret.name }}
                  key: {{ .Values.gatewayKeySecret.key }}
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent.fullname" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "agent.fullname" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agent.fullname" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "agent.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
