# The gateway writes its bootstrap API keys into a Secret ("gateway-admin") so
# the agent can read its key automatically. That requires permission to create
# and patch Secrets in this namespace — scoped as tightly as possible (a
# namespaced Role, not ClusterRole; only the secrets verbs it needs).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gateway.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gateway.fullname" . }}
    namespace: {{ .Release.Namespace }}
