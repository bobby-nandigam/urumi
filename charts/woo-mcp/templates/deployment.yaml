apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "woomcp.fullname" . }}
  labels:
    {{- include "woomcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "woomcp.fullname" . }}
  template:
    metadata:
      labels:
        {{- include "woomcp.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: woo-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: PORT
              value: "8080"
            - name: STORE_ID
              value: {{ .Values.storeId | quote }}
            - name: WOO_BASE_URL
              value: "http://{{ .Values.store.serviceHost }}:{{ .Values.store.servicePort }}"
            - name: WOO_CANONICAL_HOST
              value: {{ .Values.store.canonicalHost | quote }}
            - name: WOO_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.store.credentialsSecret }}
                  key: WOO_CONSUMER_KEY
            - name: WOO_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.store.credentialsSecret }}
                  key: WOO_CONSUMER_SECRET
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "woomcp.fullname" . }}
  labels:
    {{- include "woomcp.labels" . | nindent 4 }}
spec:
  type: ClusterIP   # internal only: never exposed via Ingress
  selector:
    app.kubernetes.io/name: {{ include "woomcp.fullname" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
