# Instance id — distinguishes copies of this identical server. The gateway
# registers each copy under its own upstream name and namespaces their
# (otherwise colliding) tool names.
instance: a

image:
  repository: urumi/utils-mcp
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicas: 1

service:
  port: 80

resources:
  requests: { cpu: 10m, memory: 48Mi }
  limits:   { cpu: 100m, memory: 128Mi }
