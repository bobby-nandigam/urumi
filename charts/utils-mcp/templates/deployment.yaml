apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "utilsmcp.fullname" . }}
  labels:
    {{- include "utilsmcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "utilsmcp.fullname" . }}
  template:
    metadata:
      labels:
        {{- include "utilsmcp.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: utils-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: PORT
              value: "8080"
            - name: INSTANCE_ID
              value: {{ .Values.instance | quote }}
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "utilsmcp.fullname" . }}
  labels:
    {{- include "utilsmcp.labels" . | nindent 4 }}
spec:
  type: ClusterIP   # internal only
  selector:
    app.kubernetes.io/name: {{ include "utilsmcp.fullname" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
