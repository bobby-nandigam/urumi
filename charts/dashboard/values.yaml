image:
  repository: urumi/dashboard
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicas: 1

service:
  port: 80

# Browse the dashboard at http://dashboard.urumi.localhost:8080 via Traefik.
ingress:
  enabled: true
  className: traefik
  host: dashboard.urumi.localhost

resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits:   { cpu: 200m, memory: 128Mi }
