apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "store.fullname" . }}-mariadb
  labels:
    {{- include "store.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.mariadb.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.mariadb.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "store.fullname" . }}-mariadb
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
spec:
  replicas: 1
  strategy:
    type: Recreate   # single RWO volume, cannot run two pods at once
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "store.fullname" . }}-mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "store.fullname" . }}-mariadb
        {{- include "store.labels" . | nindent 8 }}
        app.kubernetes.io/component: mariadb
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext:
        fsGroup: 999   # mysql group in the mariadb image
      containers:
        - name: mariadb
          image: {{ .Values.image.mariadb }}
          env:
            - name: MYSQL_DATABASE
              valueFrom: { secretKeyRef: { name: {{ include "store.fullname" . }}-secret, key: MYSQL_DATABASE } }
            - name: MYSQL_USER
              valueFrom: { secretKeyRef: { name: {{ include "store.fullname" . }}-secret, key: MYSQL_USER } }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "store.fullname" . }}-secret, key: MYSQL_PASSWORD } }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "store.fullname" . }}-secret, key: MYSQL_ROOT_PASSWORD } }
          ports:
            - containerPort: 3306
              name: mysql
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          livenessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", "mariadb -h127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1'"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources.mariadb | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "store.fullname" . }}-mariadb
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "store.fullname" . }}-mariadb
  labels:
    {{- include "store.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "store.fullname" . }}-mariadb
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
