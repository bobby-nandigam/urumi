apiVersion: v1
kind: Secret
metadata:
  name: {{ include "store.fullname" . }}-secret
  labels:
    {{- include "store.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database
  MYSQL_DATABASE: {{ .Values.database.name | quote }}
  MYSQL_USER: {{ .Values.database.user | quote }}
  MYSQL_PASSWORD: {{ .Values.database.password | quote }}
  MYSQL_ROOT_PASSWORD: {{ .Values.database.rootPassword | quote }}
  # WordPress admin (consumed by the WP-CLI setup Job)
  WP_ADMIN_USER: {{ .Values.wordpress.adminUser | quote }}
  WP_ADMIN_PASSWORD: {{ .Values.wordpress.adminPassword | quote }}
  WP_ADMIN_EMAIL: {{ .Values.wordpress.adminEmail | quote }}
  # WooCommerce REST API credentials (registered by the Job, read by the MCP server)
  WOO_CONSUMER_KEY: {{ .Values.wooApi.consumerKey | quote }}
  WOO_CONSUMER_SECRET: {{ .Values.wooApi.consumerSecret | quote }}
