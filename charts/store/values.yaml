# Default values for the store chart. Overridden per-environment by
# values-local.yaml / values-prod.yaml at the umbrella level.

# storeId is used to name the store and to scope WooCommerce tool names in the
# gateway (e.g. "default__list_products"). For the single-store core it is "default".
storeId: default
storeName: "Urumi Demo Store"

# Node pinning: local-path (k3s default) PVCs are node-local and ReadWriteOnce,
# so the WordPress pod and the WP-CLI setup Job must land on the same node.
nodeSelector:
  ingress-ready: "true"

image:
  wordpress: wordpress:7.1.3-php8.3-apache
  wordpressCli: wordpress:cli-php8.3
  mariadb: mariadb:11.4

ingress:
  className: traefik
  # The storefront host. Locally this resolves via /etc/hosts or nip.io.
  host: store.urumi.localhost

persistence:
  wordpress:
    size: 2Gi
    storageClass: local-path
  mariadb:
    size: 2Gi
    storageClass: local-path

# WordPress admin + DB credentials. These are DEV defaults rendered into a
# Kubernetes Secret. In production they come from values-prod.yaml / --set and
# are never committed. No secret is hardcoded in application source.
wordpress:
  adminUser: admin
  adminPassword: "admin-pass-change-me"
  adminEmail: admin@urumi.local
  tablePrefix: wp_

database:
  name: woocommerce
  user: wordpress
  password: "wp-db-pass-change-me"
  rootPassword: "root-db-pass-change-me"

# WooCommerce REST API key/secret. The setup Job registers these INTO WooCommerce
# (storing a hash of the key), and the WooCommerce MCP server reads the same
# Secret to authenticate. read_write permission so it can create products/orders.
wooApi:
  consumerKey: "ck_localdevconsumerkey0000000000000000000"
  consumerSecret: "cs_localdevconsumersecret00000000000000000"

resources:
  wordpress:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 750m, memory: 768Mi }
  mariadb:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
